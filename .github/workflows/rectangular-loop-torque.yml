name: JEE rectangular current-loop torque 3D qualification
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'viewer_tests/**', 'tools/**', 'examples/lessons/**', '.github/workflows/rectangular-loop-torque.yml', 'pyproject.toml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'viewer_tests/**', 'tools/**', 'examples/lessons/**', '.github/workflows/rectangular-loop-torque.yml', 'pyproject.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lesson:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYVISTA_OFF_SCREEN: 'true'
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
      MPLBACKEND: Agg
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install scientific and real native PyVista/VTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libopengl0
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'pytest==9.0.2' 'pyvista==0.48.4' 'vtk==9.6.2'
          python -m pip install --no-deps -e .
          mkdir -p output/rectangular-loop-qualification
          python -m pip freeze > output/rectangular-loop-qualification/environment.txt
          git rev-parse HEAD HEAD^{tree} > output/rectangular-loop-qualification/identities.txt
          git archive HEAD -o output/rectangular-loop-qualification/tested-source.tar
      - name: Independent analytic force-couple / energy plus live VTK tests
        run: |
          set -o pipefail
          python -W error -m pytest -q tests/test_rectangular_loop_torque.py tests/test_rectangular_loop_presentation.py viewer_tests/test_rectangular_loop_torque_runtime.py 2>&1 | tee output/rectangular-loop-qualification/tests.log
      - name: Source-bound real native 3D scenes and actual sliders
        run: |
          set -o pipefail
          python tools/qualify_rectangular_loop_torque.py --output output/rectangular-loop-qualification/scenes 2>&1 | tee output/rectangular-loop-qualification/render.log
      - name: Preserve original successes and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rectangular-loop-torque-${{ github.sha }}
          path: output/rectangular-loop-qualification/
          retention-days: 30
          if-no-files-found: warn
