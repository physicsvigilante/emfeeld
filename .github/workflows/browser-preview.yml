name: Three.js rendering-only proof of concept
on:
  pull_request:
    paths: ['web/three_preview/**', 'tools/*browser_preview.py', 'src/**', '.github/workflows/browser-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned runtime and test-only browser
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'playwright==1.57.0'
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium
          npm install --prefix web/three_preview --ignore-scripts --no-audit --no-fund
          mkdir -p output/browser-evidence
          git rev-parse HEAD HEAD^{tree} > output/browser-evidence/identities.txt
          python -m pip freeze > output/browser-evidence/python-environment.txt
          cp web/three_preview/package-lock.json output/browser-evidence/package-lock.json
          git archive HEAD -o output/browser-evidence/tested-source.tar
      - name: Test transforms and saved-sample semantics
        run: |
          set -o pipefail
          npm test --prefix web/three_preview 2>&1 | tee output/browser-evidence/node-tests.log
      - name: Export three existing scenes without altering engine code
        run: |
          set -o pipefail
          python tools/export_browser_preview.py --output output/browser-preview 2>&1 | tee output/browser-evidence/export.log
      - name: Execute actual Chromium WebGL, controls and receipts
        run: |
          set -o pipefail
          python tools/qualify_browser_preview.py --preview output/browser-preview --output output/browser-evidence/runtime 2>&1 | tee output/browser-evidence/browser-tests.log
      - name: Preserve evidence and self-contained preview, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-preview-${{ github.sha }}
          path: |
            output/browser-evidence/
            output/browser-preview/
          retention-days: 30
          if-no-files-found: warn
