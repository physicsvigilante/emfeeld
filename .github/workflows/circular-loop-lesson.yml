name: JEE circular current loop 3D axis-field qualification
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', 'viewer_tests/**', 'tools/**', 'examples/lessons/**', '.github/workflows/circular-loop-lesson.yml', 'pyproject.toml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'viewer_tests/**', 'tools/**', 'examples/lessons/**', '.github/workflows/circular-loop-lesson.yml', 'pyproject.toml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lesson:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYVISTA_OFF_SCREEN: 'true'
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
      MPLBACKEND: Agg
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned scientific and native viewer test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libopengl0
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'pytest==9.0.2' 'pyvista==0.48.4' 'vtk==9.6.2'
          python -m pip install --no-deps -e .
          mkdir -p output/circular-loop-qualification
          python -m pip freeze > output/circular-loop-qualification/environment.txt
          git rev-parse HEAD HEAD^{tree} > output/circular-loop-qualification/identities.txt
          git archive HEAD -o output/circular-loop-qualification/tested-source.tar
      - name: Analytic JEE identities, strict refusal, actual PyVista VTK events
        run: |
          set -o pipefail
          python -W error -m pytest -q tests/test_circular_loop_magnetism.py viewer_tests/test_circular_loop_runtime.py 2>&1 | tee output/circular-loop-qualification/tests.log
      - name: Produce original screenshot and integrity-linked source receipts
        run: |
          set -o pipefail
          python tools/qualify_circular_loop.py --output output/circular-loop-qualification/scenes 2>&1 | tee output/circular-loop-qualification/render.log
      - name: Preserve original successes and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: circular-loop-lesson-${{ github.sha }}
          path: output/circular-loop-qualification/
          retention-days: 30
          if-no-files-found: warn
