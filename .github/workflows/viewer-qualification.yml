name: Real PyVista qualification
on:
  push:
    branches: [foundation/analytic-fields-v1]
    paths:
      - '.github/workflows/viewer-qualification.yml'
      - 'tools/qualify_viewer.py'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYVISTA_OFF_SCREEN: 'true'
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      LIBGL_ALWAYS_SOFTWARE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install existing physics and viewer dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'pytest==9.0.2' 'pyvista==0.48.4' 'vtk==9.6.2'
          python -m pip install --no-deps -e .
          mkdir -p output/viewer-qualification
          python -m pip freeze > output/viewer-qualification/environment.txt
          git archive HEAD -o output/viewer-qualification/tested-source.tar
      - name: Full cumulative suite and compilation
        run: |
          set -o pipefail
          python -m pytest -q -W error 2>&1 | tee output/viewer-qualification/tests.log
          python -m compileall -q src tests tools
      - name: Real render and slider-event checks
        run: |
          set -o pipefail
          python tools/qualify_viewer.py 2>&1 | tee output/viewer-qualification/render.log
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: viewer-qualification-${{ github.sha }}
          path: output/viewer-qualification/
          retention-days: 30
          if-no-files-found: warn
