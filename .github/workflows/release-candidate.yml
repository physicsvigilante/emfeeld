name: Release candidate clean-install qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-candidate.yml'
      - '.gitattributes'
      - 'src/**'
      - 'tests/**'
      - 'viewer_tests/**'
      - 'tools/**'
      - 'verification/**'
      - 'examples/**'
      - 'pilots/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main, feature/teaching-study-v1]
    paths:
      - '.github/workflows/release-candidate.yml'
      - '.gitattributes'
      - 'src/**'
      - 'tests/**'
      - 'viewer_tests/**'
      - 'tools/**'
      - 'verification/**'
      - 'examples/**'
      - 'pilots/**'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: ${{ matrix.os }} / Python 3.13.5
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      PYVISTA_OFF_SCREEN: 'true'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Configure software OpenGL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libopengl0
          echo 'VTK_DEFAULT_OPENGL_WINDOW=vtkEGLRenderWindow' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
      - name: Configure Windows Mesa3D offscreen rendering (CI only)
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4
        with:
          install-mesa3d-offscreen: 'true'
          mesa3d-release: '24.3.0'
      - name: Install declared dependencies from a fresh checkout
        run: |
          set -euo pipefail
          mkdir -p output/release-candidate
          python -m pip install -e ".[dev,view]" 2>&1 | tee output/release-candidate/install.log
          python -m pip check
          python -m pip freeze > output/release-candidate/pip-freeze.txt
          python --version > output/release-candidate/python.txt
          git rev-parse HEAD > output/release-candidate/head-sha.txt
      - name: Current headless regression tests
        run: |
          set -euo pipefail
          python -m pytest -q -W error tests 2>&1 | tee output/release-candidate/headless-tests.log
      - name: Historical behavioural replay (exclude obsolete all-file freeze guard)
        run: |
          set -euo pipefail
          python -m pytest -q -W error pilots/authorability_v1/test_pilot.py -k "not test_all_available_parent_files_remain_frozen" 2>&1 | tee output/release-candidate/pilot-behaviour-tests.log
      - name: Exact published-input verification
        run: |
          set -euo pipefail
          python tools/replay_packets.py verification/v6_published.json --output output/release-candidate/replay-v6 2>&1 | tee output/release-candidate/replay.log
      - name: Validate, execute and export representative physics scenes
        run: |
          set -euo pipefail
          python -m emfeeld validate examples/ideal_sun.json 2>&1 | tee output/release-candidate/validate.log
          python -m emfeeld run examples/ideal_sun.json --output output/release-candidate/ideal_sun.npz 2>&1 | tee output/release-candidate/sun-run.log
          python -m emfeeld.observations pilots/authorability_v6/first_attempt/NUM18-THREED-EX.json --output output/release-candidate/num18.json 2>&1 | tee output/release-candidate/observation.log
          python -m compileall -q src tests tools verification
      - name: Real PyVista regression tests
        run: |
          set -euo pipefail
          python -m pytest -q -W error viewer_tests 2>&1 | tee output/release-candidate/viewer-tests.log
      - name: Real source/field/trajectory renders and slider events
        run: |
          set -euo pipefail
          python tools/qualify_viewer.py --output output/release-candidate/viewer 2>&1 | tee output/release-candidate/render.log
      - name: Two-configuration teaching studies and honest rejection
        run: |
          set -euo pipefail
          python -m emfeeld.study run examples/studies/electric.json --output output/release-candidate/study-electric --render
          python -m emfeeld.study run examples/studies/gravity.json --output output/release-candidate/study-gravity --render
          if python -m emfeeld.study run examples/studies/unsupported_conductor.json --output output/release-candidate/study-unsupported; then
            echo 'Unsupported conductor was incorrectly accepted'; exit 1
          else
            test "$?" -eq 1
          fi
      - name: Immutable named model revisions and independent-expression checks
        run: |
          set -euo pipefail
          python tools/qualify_model_revisions.py --output output/release-candidate/model-revisions --render 2>&1 | tee output/release-candidate/model-revisions.log
          python verification/check_model_revision_runs.py output/release-candidate/model-revisions --output output/release-candidate/model-revisions-analytic.json
      - name: Preserve both success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-${{ matrix.os }}-${{ github.sha }}
          path: output/release-candidate/
          retention-days: 30
          if-no-files-found: warn
