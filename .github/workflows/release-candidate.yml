name: Release candidate clean-install qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-candidate.yml'
      - '.gitattributes'
      - 'src/**'
      - 'tests/**'
      - 'viewer_tests/**'
      - 'tools/**'
      - 'verification/**'
      - 'examples/**'
      - 'pilots/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main, feature/teaching-study-v1, feature/model-revisions-v1]
    paths:
      - '.github/workflows/release-candidate.yml'
      - '.gitattributes'
      - 'src/**'
      - 'tests/**'
      - 'viewer_tests/**'
      - 'tools/**'
      - 'verification/**'
      - 'examples/**'
      - 'pilots/**'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: ${{ matrix.os }} / Python 3.13.5
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        shell: bash
    env:
      PYVISTA_OFF_SCREEN: 'true'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Configure software OpenGL on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri libopengl0
          echo 'VTK_DEFAULT_OPENGL_WINDOW=vtkEGLRenderWindow' >> "$GITHUB_ENV"
          echo 'LIBGL_ALWAYS_SOFTWARE=1' >> "$GITHUB_ENV"
      - name: Configure Windows Mesa3D offscreen rendering (CI only)
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@10e6efb97af3cd1523828f0e22c39f0e4567f3e4
        with:
          install-mesa3d-offscreen: 'true'
          mesa3d-release: '24.3.0'
      - name: Install declared dependencies from a fresh checkout
        run: |
          set -euo pipefail
          mkdir -p output/release-candidate
          python -m pip install -e ".[dev,view]" 2>&1 | tee output/release-candidate/install.log
          python -m pip check
          python -m pip freeze > output/release-candidate/pip-freeze.txt
          python --version > output/release-candidate/python.txt
          git rev-parse HEAD > output/release-candidate/head-sha.txt
      - name: Current headless regression tests
        run: |
          set -euo pipefail
          python -m pytest -q -W error tests 2>&1 | tee output/release-candidate/headless-tests.log
      - name: Historical behavioural replay (exclude obsolete all-file freeze guard)
        run: |
          set -euo pipefail
          python -m pytest -q -W error pilots/authorability_v1/test_pilot.py -k "not test_all_available_parent_files_remain_frozen" 2>&1 | tee output/release-candidate/pilot-behaviour-tests.log
      - name: Exact published-input verification
        run: |
          set -euo pipefail
          python tools/replay_packets.py verification/v6_published.json --output output/release-candidate/replay-v6 2>&1 | tee output/release-candidate/replay.log
      - name: Physics Demonstration V1 — exact analytical replay and archived evidence
        run: |
          set -euo pipefail
          python tools/replay_packets.py verification/physics_demonstration_v1.json --output output/release-candidate/physics-demo-v1 2>&1 | tee output/release-candidate/physics-demo-v1.log
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('output/release-candidate/physics-demo-v1')
          summary = json.loads((root / 'summary.json').read_text(encoding='utf-8'))
          report = json.loads((root / 'uniform_electric_v1/result.json').read_text(encoding='utf-8'))
          assert summary['passed'] is True and len(summary['cases']) == 1
          assert len(summary['cases'][0]['checks']) == 64
          assert report['status'] == 'ok' and report['counts']['requests'] == 17
          assert all(row['status'] == 'ok' for row in report['results'])
          print('Physics Demonstration V1: 17 native observations and 64 independently authored reference checks passed')
          PY
      - name: Question-first source checkpoint and actual native coverage evidence
        run: |
          set -euo pipefail
          python verification/question_first_trial_v1.py freeze examples/question_first_v1/developer_question.json --output output/release-candidate/question-first-v1/lock 2>&1 | tee output/release-candidate/question-first-v1-freeze.log
          python verification/question_first_trial_v1.py assess output/release-candidate/question-first-v1/lock --packet examples/question_first_v1/developer_packet.json --output output/release-candidate/question-first-v1/attempt 2>&1 | tee output/release-candidate/question-first-v1-assess.log
          python - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path
          root = Path('output/release-candidate/question-first-v1')
          lock = root/'lock'; run = root/'attempt'
          receipt = json.loads((lock/'receipt.json').read_text(encoding='utf-8'))
          result = json.loads((run/'assessment.json').read_text(encoding='utf-8'))
          native = json.loads((run/'native-result.json').read_text(encoding='utf-8'))
          assert hashlib.sha256((lock/'question.json').read_bytes()).hexdigest() == receipt['question_sha256']
          assert (run/'question.json').read_bytes() == (lock/'question.json').read_bytes()
          assert result['native_measurement_coverage'] == 'complete'
          assert result['requested_observations'] == 5 and native['status'] == 'ok'
          assert len(native['results']) == 5 and all(row['status'] == 'ok' for row in native['results'])
          assert result['interpretation_fidelity'] == 'not_verified'
          assert result['independent_physics_correctness'] == 'not_evaluated'
          assert result['educational_usefulness'] == 'not_evaluated'
          print('question-first V1: 5 native measurements present, source bytes bound, interpretation not certified')
          PYTHON
      - name: Public NASA ion-source question replay (non-blind evidence only)
        run: |
          set -euo pipefail
          python verification/question_first_trial_v1.py freeze examples/nasa_ion_public_v0/question.json --output output/release-candidate/nasa-ion-public-v0/lock 2>&1 | tee output/release-candidate/nasa-ion-public-v0-freeze.log
          python verification/question_first_trial_v1.py assess output/release-candidate/nasa-ion-public-v0/lock --packet examples/nasa_ion_public_v0/packet.json --output output/release-candidate/nasa-ion-public-v0/ci-replay 2>&1 | tee output/release-candidate/nasa-ion-public-v0-assess.log
          python - <<'PYTHON'
          import hashlib
          import json
          import math
          from pathlib import Path
          frozen = Path('examples/nasa_ion_public_v0')
          root = Path('output/release-candidate/nasa-ion-public-v0')
          lock, run = root/'lock', root/'ci-replay'
          question = (frozen/'question.json').read_bytes()
          packet = (frozen/'packet.json').read_bytes()
          assert hashlib.sha256(question).hexdigest() == 'cd797751a84d86caa57c2024620215895c1414169c6682b96933e4b4cf25cc23'
          assert hashlib.sha256(packet).hexdigest() == 'f86211065ec99e3e82181de256d321a6ebb054f9b397440996529a3ec6ccfeda'
          assert (lock/'question.json').read_bytes() == (run/'question.json').read_bytes() == question
          assert (lock/'receipt.json').read_bytes() == (frozen/'receipt.json').read_bytes()
          assert (run/'packet.json').read_bytes() == packet
          assessment = json.loads((run/'assessment.json').read_text(encoding='utf-8'))
          native = json.loads((run/'native-result.json').read_text(encoding='utf-8'))
          assert assessment['native_measurement_coverage'] == 'complete'
          assert assessment['requested_observations'] == 1 and assessment['issues'] == []
          assert assessment['interpretation_fidelity'] == 'not_verified'
          assert assessment['independent_physics_correctness'] == 'not_evaluated'
          assert assessment['educational_usefulness'] == 'not_evaluated'
          assert hashlib.sha256((run/'native-result.json').read_bytes()).hexdigest() == assessment['native_report_sha256']
          assert json.loads((run/'state.json').read_text(encoding='utf-8'))['execution_complete'] is True
          assert native['status'] == 'ok' and len(native['results']) == 1
          result = native['results'][0]
          assert result['id'] == 'exit_speed_native' and result['status'] == 'ok'
          assert result['quantity'] == 'speed' and result['unit'] == 'm/s'
          assert result['sample_index'] == 20
          assert math.isclose(result['time_s'], (2*0.0007/(1.6e-19*(1300/0.0007)/2.2e-25))**0.5, rel_tol=1e-14)
          assert math.isclose(result['value'], math.sqrt(2*1.6e-19*1300/2.2e-25), rel_tol=1e-9)
          print('NASA public-source NON-BLIND rehearsal: one native SI speed, interpretation not independently verified')
          PYTHON
      - name: Validate, execute and export representative physics scenes
        run: |
          set -euo pipefail
          python -m emfeeld validate examples/ideal_sun.json 2>&1 | tee output/release-candidate/validate.log
          python -m emfeeld run examples/ideal_sun.json --output output/release-candidate/ideal_sun.npz 2>&1 | tee output/release-candidate/sun-run.log
          python -m emfeeld.observations pilots/authorability_v6/first_attempt/NUM18-THREED-EX.json --output output/release-candidate/num18.json 2>&1 | tee output/release-candidate/observation.log
          python -m compileall -q src tests tools verification
      - name: Real PyVista regression tests
        run: |
          set -euo pipefail
          python -m pytest -q -W error viewer_tests 2>&1 | tee output/release-candidate/viewer-tests.log
      - name: Real source/field/trajectory renders and slider events
        run: |
          set -euo pipefail
          python tools/qualify_viewer.py --output output/release-candidate/viewer 2>&1 | tee output/release-candidate/render.log
          python tools/qualify_particle_visibility.py --output output/release-candidate/particle-visibility 2>&1 | tee output/release-candidate/particle-visibility.log
      - name: Two-configuration teaching studies and honest rejection
        run: |
          set -euo pipefail
          python -m emfeeld.study run examples/studies/electric.json --output output/release-candidate/study-electric --render
          python -m emfeeld.study run examples/studies/gravity.json --output output/release-candidate/study-gravity --render
          if python -m emfeeld.study run examples/studies/unsupported_conductor.json --output output/release-candidate/study-unsupported; then
            echo 'Unsupported conductor was incorrectly accepted'; exit 1
          else
            test "$?" -eq 1
          fi
      - name: Immutable named model revisions and independent-expression checks
        run: |
          set -euo pipefail
          python tools/qualify_model_revisions.py --output output/release-candidate/model-revisions --render 2>&1 | tee output/release-candidate/model-revisions.log
          python verification/check_model_revision_runs.py output/release-candidate/model-revisions --output output/release-candidate/model-revisions-analytic.json
      - name: Native revision-and-view command and retained analytic checks
        run: |
          set -euo pipefail
          python tools/qualify_native_model_workflow.py --output output/release-candidate/native-model --render 2>&1 | tee output/release-candidate/native-model.log
          python verification/check_model_revision_runs.py output/release-candidate/native-model --output output/release-candidate/native-model-analytic.json
      - name: Zero-energy rest launch and separate energy-time reference
        run: |
          set -euo pipefail
          python tools/qualify_energy_balance.py --output output/release-candidate/zero-energy --render 2>&1 | tee output/release-candidate/zero-energy.log
          python verification/check_zero_energy_run.py output/release-candidate/zero-energy --output output/release-candidate/zero-energy-reference.json
      - name: Structural source revisions and separate physical references
        run: |
          set -euo pipefail
          python tools/qualify_structural_revisions.py --output output/release-candidate/structural --render 2>&1 | tee output/release-candidate/structural.log
          python verification/check_structural_runs.py output/release-candidate/structural --output output/release-candidate/structural-reference.json
          python tools/qualify_structural_revisions.py --cases examples/structural_revisions/reserved_cases.json --output output/release-candidate/structural-transfer --render 2>&1 | tee output/release-candidate/structural-transfer.log
          python verification/check_structural_runs.py output/release-candidate/structural-transfer --output output/release-candidate/structural-transfer-reference.json
      - name: Reusable investigation sweeps and separate physical references
        run: |
          set -euo pipefail
          for case in E1 G1 T1; do
            python tools/qualify_sweeps.py --case "$case" --output "output/release-candidate/sweep-$case" 2>&1 | tee "output/release-candidate/sweep-$case.log"
            python verification/check_sweep_runs.py "output/release-candidate/sweep-$case/sweep" --case "$case" --output "output/release-candidate/sweep-$case-reference.json"
          done
      - name: Sealed derived observations with separate physical references
        run: |
          set -euo pipefail
          python -m pytest -q -W error tests/test_derived_observations.py 2>&1 | tee output/release-candidate/derived-tests.log
          python tools/qualify_derived_observations.py --source output/release-candidate --output output/release-candidate/derived-001 2>&1 | tee output/release-candidate/derived-reference.log
      - name: Independent test-particle structural revisions and physics references
        run: |
          set -euo pipefail
          python tools/qualify_particle_revisions.py --output output/release-candidate/particle-revisions --render 2>&1 | tee output/release-candidate/particle-revisions.log
          python verification/check_particle_revision_runs.py output/release-candidate/particle-revisions --report output/release-candidate/particle-revisions-reference.json 2>&1 | tee output/release-candidate/particle-revisions-reference.log
      - name: Atomic scenario revisions and separate physical references
        run: |
          set -euo pipefail
          python -m pytest -q -W error tests/test_atomic_revisions.py 2>&1 | tee output/release-candidate/atomic-tests.log
          python tools/qualify_atomic_revisions.py --output output/release-candidate/atomic-revisions --render 2>&1 | tee output/release-candidate/atomic-revisions.log
          python verification/check_atomic_revision_runs.py output/release-candidate/atomic-revisions --report output/release-candidate/atomic-revisions-reference.json 2>&1 | tee output/release-candidate/atomic-revisions-reference.log
      - name: Sealed cross-scenario comparisons and separate physical references
        run: |
          set -euo pipefail
          python -m pytest -q -W error tests/test_scenario_comparisons.py 2>&1 | tee output/release-candidate/scenario-comparison-tests.log
          python tools/qualify_scenario_comparisons.py --output output/release-candidate/scenario-comparisons 2>&1 | tee output/release-candidate/scenario-comparisons.log
          python verification/check_scenario_comparison_runs.py output/release-candidate/scenario-comparisons --report output/release-candidate/scenario-comparison-reference.json 2>&1 | tee output/release-candidate/scenario-comparison-reference.log
      - name: Bounded scenario ensembles and separate physical references
        run: |
          set -euo pipefail
          python -m pytest -q -W error tests/test_scenario_ensembles.py 2>&1 | tee output/release-candidate/scenario-ensemble-tests.log
          python tools/qualify_scenario_ensembles.py --output output/release-candidate/scenario-ensembles 2>&1 | tee output/release-candidate/scenario-ensembles.log
          python verification/check_scenario_ensemble_runs.py output/release-candidate/scenario-ensembles --report output/release-candidate/scenario-ensemble-reference.json 2>&1 | tee output/release-candidate/scenario-ensemble-reference.log
      - name: Project verified signed ensemble measurements without new physics or writes
        run: |
          set -euo pipefail
          python -m emfeeld.scenario_ensembles measurements output/release-candidate/scenario-ensembles/E1/ensemble --store output/release-candidate/scenario-ensembles/E1/store --using output/release-candidate/scenario-ensembles/E1/parent-template > output/release-candidate/ensemble-measurements-E1.json
          if python -m emfeeld.scenario_ensembles measurements output/release-candidate/scenario-ensembles/G1/ensemble --store output/release-candidate/scenario-ensembles/G1/store --using output/release-candidate/scenario-ensembles/G1/parent-template --member hypothesis-B > output/release-candidate/ensemble-measurements-G1.json; then
            echo 'G1 readout incorrectly returned complete'; exit 1
          else
            test "$?" -eq 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('output/release-candidate')
          e=json.loads((root/'ensemble-measurements-E1.json').read_bytes())
          g=json.loads((root/'ensemble-measurements-G1.json').read_bytes())
          assert e['status']=='complete' and len(e['members'])==2
          assert all(m['comparison_status']=='complete' for m in e['members'])
          assert all(m['measurements'] and all(v['status']=='ok' for v in m['measurements']) for m in e['members'])
          assert g['status']=='partial' and g['selection']=='member:hypothesis-B'
          assert len(g['members'])==1 and g['members'][0]['run_status']=='complete'
          assert g['members'][0]['comparison_status']=='partial'
          assert sum(v['status']=='unavailable' for v in g['members'][0]['measurements'])==1
          assert all(v['value'] is None and v['code']=='unknown_operand'
                     for v in g['members'][0]['measurements'] if v['status']=='unavailable')
          assert all(m['evidence']['result_sha256'] and m['evidence']['request_sha256']
                     for m in e['members']+g['members'])
          print('verified E1 complete and G1 honest partial readouts from sealed native records')
          PY
      - name: Render original sealed signed measurements into deterministic Markdown tables
        run: |
          set -euo pipefail
          python -m emfeeld.scenario_ensembles table output/release-candidate/scenario-ensembles/E1/ensemble --store output/release-candidate/scenario-ensembles/E1/store --using output/release-candidate/scenario-ensembles/E1/parent-template > output/release-candidate/ensemble-evidence-table-E1.md
          if python -m emfeeld.scenario_ensembles table output/release-candidate/scenario-ensembles/G1/ensemble --store output/release-candidate/scenario-ensembles/G1/store --using output/release-candidate/scenario-ensembles/G1/parent-template --member hypothesis-B > output/release-candidate/ensemble-evidence-table-G1.md; then
            echo 'G1 table incorrectly returned globally complete'; exit 1
          else
            test "$?" -eq 1
          fi
          python - <<'PYTHON'
          import json
          from pathlib import Path
          from emfeeld.scenario_ensembles import _ensemble_measurement_table
          root=Path('output/release-candidate')
          for case in ('E1','G1'):
              native=json.loads((root/f'ensemble-measurements-{case}.json').read_bytes())
              rendered=(root/f'ensemble-evidence-table-{case}.md').read_text(encoding='utf-8')
              assert rendered==_ensemble_measurement_table(native)
              assert 'Signed original **member (right) minus freshly computed baseline (left)**' in rendered
              assert f'Global ensemble status: **{native["status"]}**' in rendered
              expected=sum(len(m['measurements']) if m['measurements'] else 1 for m in native['members'])
              section=rendered.split('## Original sealed measurement values')[1].split('## Original comparison and native-run SHA256 bindings')[0]
              assert len([line for line in section.splitlines() if line.startswith('| ')])==2+expected
              for m in native['members']:
                  if m['evidence']:
                      assert all(value in rendered for value in m['evidence'].values())
          assert 'unavailable (no numeric value)' in (root/'ensemble-evidence-table-G1.md').read_text(encoding='utf-8')
          print('verified E1 complete and G1 partial Markdown table/source receipt binding')
          PYTHON
      - name: Verify native view delegation for sealed ensemble baseline and partial comparison member
        run: |
          set -euo pipefail
          python -m emfeeld.scenario_ensembles view output/release-candidate/scenario-ensembles/E1/ensemble --store output/release-candidate/scenario-ensembles/E1/store --using output/release-candidate/scenario-ensembles/E1/parent-template --baseline --output output/release-candidate/ensemble-view-E1-baseline 2>&1 | tee output/release-candidate/ensemble-view-E1.log
          python -m emfeeld.scenario_ensembles view output/release-candidate/scenario-ensembles/G1/ensemble --store output/release-candidate/scenario-ensembles/G1/store --using output/release-candidate/scenario-ensembles/G1/parent-template --member hypothesis-B --output output/release-candidate/ensemble-view-G1-member 2>&1 | tee output/release-candidate/ensemble-view-G1.log
      - name: Preserve both success and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc-${{ matrix.os }}-${{ github.sha }}
          path: output/release-candidate/
          retention-days: 30
          if-no-files-found: warn
