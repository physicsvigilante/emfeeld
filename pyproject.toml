[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emfeeld"
version = "0.1.0"
description = "Composable analytic electric and gravitational fields in 3D"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
view = ["pyvista>=0.46,<0.50"]
dev = ["pytest>=8,<10"]

[project.scripts]
emfeeld = "emfeeld.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
